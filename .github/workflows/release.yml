name: Release

# Cut a release by pushing a tag:  git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'
  # Manual dry-run (builds both installers; you pick the version).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3)'
        required: true

permissions:
  contents: write          # needed to create the GitHub Release
  id-token: write          # OIDC login to Azure for code signing (no stored secrets)

# Code signing: Azure Artifact Signing (formerly Trusted Signing). Microsoft holds
# the certificate and key; the job logs in to Azure through GitHub OIDC and
# signtool calls the service through its dlib plug-in — no secret is stored here.
# Configure these as *repository* variables (not environment variables — the
# workflow-level `env` below cannot see those); none of them is a secret:
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID   Entra app registration
#   ARTIFACT_SIGNING_ENDPOINT   region endpoint, e.g. https://jpe.codesigning.azure.net
#   ARTIFACT_SIGNING_ACCOUNT    Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE    certificate profile name
# While ARTIFACT_SIGNING_PROFILE is unset the workflow still runs and ships
# unsigned installers.
env:
  SIGNING: ${{ vars.ARTIFACT_SIGNING_PROFILE != '' }}

jobs:
  # WSL2 support ships Linux binaries inside the Windows installer: our bridge
  # (wsl/bridge) plus `imk` and `pam_immurok.so` from the Linux app, which run
  # unmodified inside WSL. They are built here from source, once per
  # architecture, so a Windows release depends on no Linux release — only on
  # the app-linux-rs sources being on GitHub.
  # debian:12 is the glibc baseline (2.36): pam_immurok.so is the one file in
  # the payload that is not static.
  wsl-payload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential musl-tools libpam0g-dev curl ca-certificates git
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: immurok/app-linux-rs
          path: linux-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - name: Build payload
        run: |
          set -euo pipefail
          echo "app-linux-rs at $(git -C linux-src rev-parse HEAD)"
          cargo test --locked --manifest-path wsl/bridge/Cargo.toml
          sh wsl/build-payload.sh --linux-src linux-src --out "dist/immurok-wsl-payload-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-payload-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # One payload carrying both architectures goes into both installers; the
  # install script inside it picks by `uname -m`. merge-payload.sh refuses
  # inputs built from different sources and a result missing either one.
  wsl-payload-merge:
    needs: wsl-payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: wsl-payload-*
          path: parts
          merge-multiple: true
      - name: Merge
        run: sh wsl/merge-payload.sh --out dist/immurok-wsl-payload.tar.gz parts/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-payload
          path: dist/immurok-wsl-payload.tar.gz
          if-no-files-found: error

  build:
    needs: wsl-payload-merge
    # The Azure federated credential is bound to this environment
    # (subject repo:immurok/app-win:environment:release), so only this job can
    # sign. Add required reviewers to the environment to gate every release.
    environment: release
    # windows-2025 ships the rest of what this build needs:
    #   · Inno Setup 6            (packaging/build-installer.ps1 finds ISCC via the registry)
    #   · .NET 8 runtime          (the Artifact Signing dlib runs on it)
    #   · MSVC ARM64 toolchain    (Microsoft.VisualStudio.Component.VC.Tools.ARM64)
    # That last one is why both architectures can be built on a hosted runner —
    # the Credential Provider must be compiled natively per architecture, since
    # Windows will not load an x64 in-process DLL into a native Arm64 LogonUI.
    # The .NET 10 SDK is installed explicitly below rather than trusting the image.
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Toolchain versions
        shell: pwsh
        run: |
          dotnet --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -property catalog_productDisplayVersion

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''   # v1.2.3 -> 1.2.3
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $v"

      - name: Azure login (OIDC)
        if: env.SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # build-installer.ps1 picks the payload up from packaging\wsl\ and fails
      # if it is absent or lacks an architecture it is building for.
      - uses: actions/download-artifact@v7
        with:
          name: wsl-payload
          path: packaging/wsl

      # build-installer.ps1 fetches the signing dlib, signs our own exe/dll, then
      # has Inno Setup sign the installer and the uninstaller, and fails the build
      # if the result does not carry a valid signature. Signatures are timestamped
      # (the service's certificates live for only three days).
      - name: Build installers (x64 + arm64)
        shell: pwsh
        run: |
          $sign = @{}
          if ($env:SIGNING -eq 'true') {
            $sign = @{
              ArtifactSigningEndpoint = '${{ vars.ARTIFACT_SIGNING_ENDPOINT }}'
              ArtifactSigningAccount  = '${{ vars.ARTIFACT_SIGNING_ACCOUNT }}'
              ArtifactSigningProfile  = '${{ vars.ARTIFACT_SIGNING_PROFILE }}'
            }
          }
          .\packaging\build-installer.ps1 -Version '${{ steps.ver.outputs.version }}' @sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: immurok-installers
          path: packaging/out/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/out/*.exe
          generate_release_notes: true
          # Tags with a SemVer pre-release suffix (e.g. v1.20.0-beta.1) publish
          # as a GitHub pre-release; clean tags (v1.20.0) publish as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Everything between the announce:skip markers is standing install
          # advice, not a changelog: discord-release.yml leaves it off the card.
          body: |
            <!-- announce:skip -->
            ${{ env.SIGNING != 'true' && '> **Unsigned build.** SmartScreen will warn on first run.' || '' }}

            > The Credential Provider hooks the Windows sign-in path — validate in a
            > snapshotted VM and keep password sign-in as a fallback before deploying
            > to a machine you rely on.

            Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0);
            if it is missing, the installer downloads and installs it from Microsoft
            (hash-pinned at build time) before continuing.

            Pick the package matching your CPU: `x64` for Intel/AMD, `arm64` for
            Windows on Arm. They are not interchangeable — the x64 package refuses
            to install on an Arm64 PC.
            <!-- /announce:skip -->

  # Discord card. Called from here because the release above is created with
  # GITHUB_TOKEN, which never triggers `on: release` in another workflow.
  announce:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
